# Local dev stack. By default only MySQL, Redis and RabbitMQ run and the server
# and worker run on the host (make run / go run). To run them in containers too:
#   docker compose --profile app up -d --build --wait
# All published ports bind 127.0.0.1 only.

x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  REDIS_ADDR: redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
  JWT_PRIVATE_KEY_PATH: /keys/private.pem
  JWT_PUBLIC_KEY_PATH: /keys/public.pem
  METRICS_PORT: "9100"

services:
  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # empty REDIS_PASSWORD = no auth
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # an empty REDISCLI_AUTH is ignored, so this works with and without a password
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      # The broker user comes from RABBITMQ_USER/RABBITMQ_PASSWORD (guest/guest only if unset).
      # Keep RABBITMQ_URL in .env on the same user/password, or make run cannot connect.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./deploy/observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # local only: the default guest user may connect from other containers
      - ./deploy/observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-local.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # --- profile "app": server and worker in containers ---

  migrate:
    profiles: ["app"]
    image: migrate/migrate:v4.18.3
    volumes:
      - ./deploy/migrations:/migrations:ro
    # passwords containing URL-special characters must be percent-encoded here
    command:
      - -path=/migrations
      - -database=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DB}
      - up
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  server:
    profiles: ["app"]
    build:
      context: .
      target: server
    env_file: .env
    # PASSWORD_RESET_URL stays on localhost, so an empty SMTP_HOST is allowed
    environment: *app-env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    env_file: .env
    # config.Load requires the JWT paths even though the worker never reads the keys
    environment: *app-env
    volumes:
      - ./keys:/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
