openapi: "3.0.3"

info:
  title: Short Link API
  description: URL shortening service — shorten, redirect, manage links.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

paths:

  /healthz:
    get:
      summary: Health check
      description: Reports the status of MySQL, Redis and RabbitMQ.
      security: []
      tags: [System]
      responses:
        "200":
          description: All dependencies are up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { mysql: "ok", redis: "ok", rabbitmq: "ok" }
        "503":
          description: At least one dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { mysql: "ok", redis: "down", rabbitmq: "ok" }

  /{code}:
    get:
      summary: Redirect to original URL
      description: |
        Public endpoint — no authentication required.
        Resolves the short code and issues a 302 redirect.
        Click events are recorded asynchronously. Expired and deleted links
        return 404. Limited to 60 requests per minute per IP.
      security: []
      tags: [Links]
      parameters:
        - $ref: "#/components/parameters/code"
      responses:
        "302":
          description: Redirect to original URL
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: https://www.example.com/some/long/path
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: An admin disabled the link, or the account that owns it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "link disabled"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/register:
    post:
      summary: Register a new user
      description: |
        Creates an account and returns a token pair. Email is case-insensitive
        (`A@x.com` = `a@x.com`). Limited to 5 requests per hour per IP.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Missing email/password, or password not 8–72 bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "password must be 8-72 characters"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "email already registered"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/login:
    post:
      summary: Log in
      description: |
        Returns a new token pair. After 5 failed attempts the email is locked
        for 15 minutes, even for the correct password. Limited to 10 requests
        per minute per IP.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong email or password (the response does not say which)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid email or password"
        "403":
          description: |
            The password is right but an admin has disabled the account. Only
            returned after the password matched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "account disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          description: |
            Per-IP rate limit (`rate limit exceeded`, with `Retry-After`) or
            the email is locked after too many failed attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "account temporarily locked due to too many failed attempts"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      description: |
        Each refresh token works exactly once; the response contains a new one.
        Limited to 30 requests per minute per IP.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Refresh token invalid, expired or already used, or the account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid or expired refresh token"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/forgot-password:
    post:
      summary: Request a password reset link
      description: |
        If the email belongs to an account, a single-use link to
        `PASSWORD_RESET_URL?token=...` is emailed. It expires after 30 minutes,
        and requesting a new one invalidates the previous link. At most one
        mail per address per minute and five per day. The response is the
        same whether or not the email exists, and the work happens after it
        is sent. Limited to 5 requests per hour per IP.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "202":
          description: Request accepted (for every email, registered or not)
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/reset-password:
    post:
      summary: Set a new password with a reset token
      description: |
        Uses the token from the emailed link. On success every existing
        session of the user is ended (refresh tokens revoked) and the user
        signs in again. A weak password does not use up the token. Limited to
        10 requests per minute per IP.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: The `token` query parameter of the reset link.
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: 8–72 bytes.
      responses:
        "204":
          description: Password changed
        "400":
          description: Missing field, or password not 8–72 bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "password must be 8-72 characters"
        "401":
          description: Token unknown, expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid or expired reset token"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/links:
    post:
      summary: Shorten a URL
      tags: [Links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortenRequest"
            example:
              url: "https://www.example.com/some/very/long/path?with=query"
              alias: "sale-2026"
              expires_at: "2026-12-31T23:59:59Z"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortenResponse"
              example:
                short_url: "http://localhost:8080/aB3xY9zQ1k"
                code: "aB3xY9zQ1k"
                expires_at: "2026-12-31T23:59:59Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An admin has disabled the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "account disabled"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: The URL targets a private, loopback or otherwise internal address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "URL targets a forbidden address"
        "409":
          description: The alias is already used by another link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "alias already taken"
        "429":
          description: |
            Too many requests from this IP (`rate limit exceeded`), or the user
            has created `quota_daily` links today, UTC (`daily link quota exceeded`;
            `Retry-After` is the number of seconds until 00:00 UTC).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "daily link quota exceeded"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      summary: List authenticated user's links
      description: Returns a cursor-paginated list of links (page size 20).
      tags: [Links]
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from `next_cursor` in the previous response.
          schema:
            type: string
          example: "1234567890123456789"
      responses:
        "200":
          description: Paginated list of links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/links/availability:
    get:
      summary: Check whether an alias can be used
      description: |
        Meant to be called while the user types an alias. The answer can go
        stale, so `POST /api/links` may still return 409. Limited to 60
        requests per minute per IP.
      tags: [Links]
      parameters:
        - name: alias
          in: query
          required: true
          schema:
            type: string
          example: "sale-2026"
      responses:
        "200":
          description: Availability of the alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasAvailability"
              examples:
                available:
                  value: { alias: "sale-2026", available: true }
                taken:
                  value: { alias: "sale-2026", available: false, reason: "taken" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/links/{code}:
    delete:
      summary: Delete a link
      description: Only the owner of the link may delete it.
      tags: [Links]
      parameters:
        - $ref: "#/components/parameters/code"
      responses:
        "204":
          description: Link deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/me:
    get:
      summary: The signed-in admin
      description: |
        200 for an enabled admin, 403 for anyone else. The web app uses it to
        decide whether to show the admin area.
      tags: [Admin]
      responses:
        "200":
          description: The admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, example: "7311234567890123456" }
                  email: { type: string, example: "admin@example.com" }
                  role: { type: string, enum: [admin] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/users:
    get:
      summary: List users
      description: Newest first, 20 per page.
      tags: [Admin]
      parameters:
        - name: q
          in: query
          description: Email contains this text.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - $ref: "#/components/parameters/adminCursor"
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  next_cursor:
                    type: string
                    description: Pass as `cursor` for the next page. Empty on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      summary: Get a user
      tags: [Admin]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Change a user's daily link quota
      description: Audited as `user.quota` with the values before and after.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quota_daily]
              properties:
                quota_daily: { type: integer, minimum: 0, maximum: 100000 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      summary: Disable a user
      description: |
        The user can no longer sign in, all their sessions end, they cannot
        create links, and all their links answer 410. Calling it on a disabled
        user returns 200 and writes no audit entry (it still revokes sessions
        and clears the cache, so a retry after an error finishes the job).
      tags: [Admin]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: The disabled user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          description: An admin cannot disable their own account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "cannot disable yourself" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      summary: Enable a user
      description: Their links redirect again, except links an admin disabled one by one.
      tags: [Admin]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: The enabled user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/links:
    get:
      summary: List all links
      description: Newest first, 20 per page.
      tags: [Admin]
      parameters:
        - name: q
          in: query
          description: Short code equals this text, or the original URL contains it.
          schema: { type: string }
        - name: status
          in: query
          description: |
            `active`: not disabled, owner not disabled, not expired.
            `disabled`: the link or its owner is disabled. `expired`: past `expires_at`.
          schema: { type: string, enum: [active, disabled, expired] }
        - name: user_id
          in: query
          description: Only links of this user.
          schema: { type: string }
        - $ref: "#/components/parameters/adminCursor"
      responses:
        "200":
          description: A page of links
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items: { $ref: "#/components/schemas/AdminLink" }
                  next_cursor: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/links/{code}/disable:
    parameters:
      - $ref: "#/components/parameters/code"
    post:
      summary: Disable a link
      description: The link answers 410 from the next request on. Idempotent.
      tags: [Admin]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLink" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/links/{code}/enable:
    parameters:
      - $ref: "#/components/parameters/code"
    post:
      summary: Enable a link
      description: Still answers 410 while its owner is disabled.
      tags: [Admin]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLink" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/links/{code}:
    parameters:
      - $ref: "#/components/parameters/code"
    delete:
      summary: Delete any link
      tags: [Admin]
      requestBody:
        $ref: "#/components/requestBodies/Reason"
      responses:
        "204":
          description: Link deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/audit:
    get:
      summary: List admin actions
      description: Newest first, 20 per page.
      tags: [Admin]
      parameters:
        - name: actor_id
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string, enum: [user, link] }
        - $ref: "#/components/parameters/adminCursor"
      responses:
        "200":
          description: A page of audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  next_cursor: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/stats:
    get:
      summary: Dashboard numbers
      description: |
        Totals over the whole database, one entry per UTC day for the last
        `days` days ending today (oldest first, zeros where nothing happened),
        and the 10 links with the most clicks in that range. Per-day clicks
        start when the click worker began recording them; earlier clicks are
        only in the totals. A click is counted on the UTC day the worker
        records it, so a worker backlog across midnight shifts clicks to the
        next day.
      tags: [Admin]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT access token (15 min TTL) from `/api/auth/login`, `/api/auth/register` or `/api/auth/refresh`.

  parameters:
    code:
      name: code
      in: path
      required: true
      description: Generated base62 code or a custom alias. Case-sensitive.
      schema:
        type: string
        pattern: "^[0-9A-Za-z_-]{3,16}$"
      example: aB3xY9zQ1k

    userId:
      name: id
      in: path
      required: true
      description: User ID (a string; snowflake IDs exceed JavaScript's safe integer range).
      schema:
        type: string
        pattern: "^[0-9]+$"

    adminCursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string

  requestBodies:

    Reason:
      required: false
      description: Optional reason, stored in the audit log.
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string, maxLength: 500 }

  schemas:

    AdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        quota_daily: { type: integer }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        link_count: { type: integer }

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          properties:
            links_today: { type: integer, description: Links created since 00:00 UTC }
            total_clicks: { type: integer }

    AdminLink:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        short_url: { type: string, format: uri }
        original_url: { type: string, format: uri }
        clicks: { type: integer }
        owner:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            disabled_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actor:
          type: object
          nullable: true
          description: The admin who acted; null for the `server admin` command.
          properties:
            id: { type: string }
            email: { type: string }
        action:
          type: string
          enum: [user.disable, user.enable, user.quota, link.disable, link.enable, link.delete, admin.grant, admin.revoke]
        resource_type: { type: string, enum: [user, link] }
        resource_id: { type: string }
        metadata:
          type: object
          description: "`reason` when given; `before`/`after` for quota; `code` for links."
        created_at: { type: string, format: date-time }

    AdminStats:
      type: object
      properties:
        totals:
          type: object
          properties:
            users: { type: integer }
            links: { type: integer }
            clicks: { type: integer }
            disabled_users: { type: integer }
            disabled_links: { type: integer, description: Links that are disabled or whose owner is disabled }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date, example: "2026-10-18" }
              new_users: { type: integer }
              new_links: { type: integer }
              clicks: { type: integer }
        top_links:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              clicks: { type: integer, description: Clicks within the range }

    ShortenRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The original URL to shorten. Must use http or https.
          example: "https://www.example.com/some/very/long/path"
        alias:
          type: string
          pattern: "^[0-9A-Za-z_-]{3,16}$"
          description: |
            Optional custom short code, used as-is (case-sensitive). `api`,
            `docs`, `healthz` and `metrics` are reserved in any case. Omit or
            leave empty to get a generated code.
          example: "sale-2026"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry time in RFC3339 format.
          example: "2026-12-31T23:59:59Z"

    ShortenResponse:
      type: object
      properties:
        short_url:
          type: string
          format: uri
          description: Fully-qualified short URL ready to share.
          example: "http://localhost:8080/aB3xY9zQ1k"
        code:
          type: string
          description: The short code portion of the URL.
          example: "aB3xY9zQ1k"
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"

    Link:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Snowflake ID. Exceeds 2^53, so parse it with a big-integer-safe JSON reader in JavaScript.
          example: 1234567890123456789
        short_url:
          type: string
          format: uri
          example: "http://localhost:8080/aB3xY9zQ1k"
        code:
          type: string
          example: "aB3xY9zQ1k"
        original_url:
          type: string
          format: uri
          example: "https://www.example.com/some/very/long/path"
        clicks:
          type: integer
          format: int64
          description: Aggregated click count (updated in batch, not per-redirect).
          example: 142
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"
        created_at:
          type: string
          format: date-time
          example: "2026-04-09T10:00:00Z"

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8–72 bytes.
          example: "correct-horse-battery"

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: "RS256 JWT, valid 15 minutes. Send as `Authorization: Bearer <token>`."
        refresh_token:
          type: string
          description: RS256 JWT, valid 7 days, single use.

    Health:
      type: object
      properties:
        mysql:
          type: string
          enum: [ok, down]
        redis:
          type: string
          enum: [ok, down]
        rabbitmq:
          type: string
          enum: [ok, down]

    ListResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `?cursor=` in the next request. Empty string means no more pages.
          example: "1234567890123456789"

    AliasAvailability:
      type: object
      required: [alias, available]
      properties:
        alias:
          type: string
        available:
          type: boolean
        reason:
          type: string
          enum: [invalid, reserved, taken]
          description: Present only when `available` is false.

    Error:
      type: object
      properties:
        error:
          type: string
          example: "link not found"

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "invalid request body"

    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "unauthorized"

    Forbidden:
      description: Signed in, but not an enabled admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "forbidden"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "link not found"

    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
          example: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "rate limit exceeded"

    PayloadTooLarge:
      description: Request body larger than 1 MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "request body too large"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "failed to resolve link"
