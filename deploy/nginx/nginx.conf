# Rate limiting zones — defined in http context
limit_req_zone  $binary_remote_addr zone=global:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};

    # TLS — issued by certbot (see docs/deploy.md). ${DOMAIN} is substituted by
    # the nginx image's envsubst template step; nginx $variables are left alone.
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (also set by app middleware for defense-in-depth)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # DDoS — connection and request rate limits
    limit_req  zone=global burst=200 nodelay;
    limit_conn addr 50;

    # Block empty or suspicious User-Agents (scrapers, scanners)
    if ($http_user_agent = "") { return 403; }
    if ($http_user_agent ~* "(nikto|sqlmap|masscan|zgrab|nmap|python-requests/2\.)" ) {
        return 403;
    }

    # Max request body size (defence-in-depth; app also enforces 1 MB)
    client_max_body_size 2m;

    # Proxy to Go server
    location / {
        proxy_pass         http://server:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Block external access to /metrics (Prometheus scrapes internally)
    location /metrics {
        deny all;
    }
}
